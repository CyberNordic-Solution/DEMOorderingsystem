name: Temporary UK Norway Import Radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-uk-no:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch and clean UK Norway data
        env:
          IMPORT_RADAR_OUT: import-radar-uk-no-output
        run: python tools/import_radar_uk_no_bulk_v3.py
      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: import-radar-uk-no-raw
          path: import-radar-uk-no-output/
          retention-days: 1
          if-no-files-found: error
