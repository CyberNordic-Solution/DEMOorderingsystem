name: Temporary UK Norway Import Radar

on:
  pull_request:
    branches: [main]
    paths:
      - tools/import_radar_uk_no.py
      - tools/import_radar_uk_no_bulk.py
      - tools/import_radar_uk_no_bulk_v2.py
      - .github/workflows/temp-import-radar-uk-no.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-uk-no:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch and clean UK Norway data
        env:
          IMPORT_RADAR_OUT: import-radar-uk-no-output
        run: python tools/import_radar_uk_no_bulk_v2.py
      - name: Show summary
        if: always()
        run: |
          find import-radar-uk-no-output -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          test -f import-radar-uk-no-output/run_metadata.json && cat import-radar-uk-no-output/run_metadata.json || true
      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: import-radar-uk-no-raw
          path: import-radar-uk-no-output/
          retention-days: 1
          if-no-files-found: error
